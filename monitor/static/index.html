<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Australis Monitor</title>
<link rel="icon" href="img/dark_logo.png">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="topbar-left">
      <button id="sidebar-toggle" class="sidebar-toggle" data-tooltip="Expandir/Recolher"><i class="bi bi-list"></i></button>
      <img src="img/dark_logo.png" alt="" class="topbar-logo">
      <span class="topbar-title">Australis Monitor</span>
      <button class="topbar-search-btn" onclick="openCmd()">
        <i class="bi bi-search"></i>
        <span>Busca rápida...</span>
        <div class="topbar-kbd">Ctrl K</div>
      </button>
    </div>
		<div class="topbar-right">
			<div style="display: flex; align-items: center; gap: 12px; padding-right: 16px; border-right: 1px solid var(--border); margin-right: 16px;">
			  <div class="dropdown" style="position: relative; display: inline-block;">
			    <button id="export-btn" class="topbar-btn" data-tooltip="Exportar Relatório">
			      <i class="bi bi-download"></i>
			    </button>
			    <div class="dropdown-content" id="export-dropdown-content">
			      <button onclick="exportToPDF()"><i class="bi bi-file-earmark-pdf"></i> Exportar como PDF</button>
			      <button onclick="exportToCSV()"><i class="bi bi-file-earmark-spreadsheet"></i> Exportar Tabelas (CSV)</button>
			    </div>
			  </div>

			  <div class="auto-refresh-dropdown">
			    <button id="auto-refresh-btn" class="topbar-btn" data-tooltip="Atualização Automática">
			      <i class="bi bi-arrow-clockwise"></i> 
			      <span id="refresh-indicator" style="font-size: 0.75rem; font-weight: bold; color: var(--accent-green); display: none;">ON</span>
			    </button>
			    <div class="dropdown-content" id="refresh-dropdown-content">
			      <button onclick="setAutoRefresh(0)">Desativado</button>
			      <button onclick="setAutoRefresh(60000)">1 minuto</button>
			      <button onclick="setAutoRefresh(300000)">5 minutos</button>
			      <button onclick="setAutoRefresh(900000)">15 minutos</button>
			    </div>
			  </div>
			  <button onclick="toggleTheme()" class="topbar-btn" data-tooltip="Alternar Tema">
			    <i class="bi bi-moon-stars" id="theme-icon"></i>
			  </button>
				<button onclick="toggleFullScreen()" class="topbar-btn" data-tooltip="Modo TV (Tela Cheia)">
				  <i class="bi bi-arrows-fullscreen"></i>
				</button>
				<button onclick="openBugReportModal()" class="topbar-btn" data-tooltip="Reportar Problema">
				  <i class="bi bi-bug"></i>
				</button>
			</div>
		  
		  <div class="user-dropdown">
		    <div class="user-info" id="user-menu-btn">
		      <i class="bi bi-person-circle"></i>
		      <span id="user-name"></span>
		      <i class="bi bi-chevron-down" style="font-size: 0.8rem;"></i>
		    </div>
		    <div class="dropdown-content" id="user-dropdown-content">
		      <button onclick="openProfileModal()"><i class="bi bi-person-badge"></i> Dados Pessoais</button>
		      <button onclick="logout()" class="text-red"><i class="bi bi-box-arrow-right"></i> Sair do sistema</button>
		    </div>
		  </div>
		</div>
	  </header>
	  
	  <div class="main-container">
	    <nav class="sidebar">
	      <ul id="nav-list"></ul>
	    </nav>
	    <main id="content"></main>
	  </div>
	</div>

	<div id="profile-modal" class="modal hidden">
	  <div class="modal-content profile-modal-content" style="max-width: 400px; width: 100%;">
	    <button class="modal-close" onclick="closeProfileModal()" style="z-index: 10; color: #fff;">&times;</button>
	    <div class="profile-cover"></div>
	    <div class="profile-avatar-wrapper">
	      <i class="bi bi-person-circle"></i>
	    </div>
	    <div class="profile-info-section">
	      <h3 id="profile-modal-name" class="profile-name"></h3>
	      <span id="profile-modal-role" class="profile-role-badge"></span>
	      
	      <div class="profile-details-grid">
	        <div class="profile-detail-item">
	          <span class="profile-detail-label">ID da Conta</span>
	          <span id="profile-modal-account" class="profile-detail-value"></span>
	        </div>
	        <div class="profile-detail-item">
	          <span class="profile-detail-label">Status</span>
	          <span class="profile-detail-value" style="color: var(--accent-green); display: flex; align-items: center; gap: 6px;">
	            <i class="bi bi-circle-fill" style="font-size: 0.5rem;"></i> Ativo
	          </span>
	        </div>
	      </div>
	    </div>
	  </div>
	</div>
  </header>
  
  <div class="main-container">
    <nav class="sidebar">
      <ul id="nav-list"></ul>
    </nav>
    <main id="content"></main>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.1/jspdf.plugin.autotable.min.js"></script>
<script src="js/core.js"></script>
<script src="js/reports.js"></script>
<script src="js/me.js"></script>
<script src="js/homepage.js"></script>
<script src="js/sla.js"></script>
<script src="js/overview.js"></script>
<script src="js/today.js"></script>
<script src="js/agents.js"></script>
<script src="js/agent_detail.js"></script>
<script src="js/conversations.js"></script>
<script src="js/clients.js"></script>
<script src="js/settings.js"></script>
<script src="js/app.js"></script>
</body>
</html>
