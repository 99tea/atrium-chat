<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Australis Monitor</title>
<link rel="icon" href="img/dark_logo.png">
<link rel="stylesheet" href="css/login_style.css">
</head>
<body>
<div class="login-box">
  <img src="img/dark_logo.png" alt="Australis" class="login-logo">
  <h1>Australis Monitor</h1>
  <p class="login-subtitle">Entre com sua conta do Chatwoot</p>
  <div class="form-group">
    <label for="email">E-mail</label>
    <input id="email" type="email" placeholder="seu@email.com">
  </div>
  <div class="form-group">
    <label for="token">Access Token do Chatwoot</label>
    <input id="token" type="password" placeholder="Access Token">
  </div>
  <button onclick="login()">Entrar</button>
  <p id="error" class="error"></p>
</div>
<script>
async function login() {
  const email = document.getElementById('email').value;
  const token = document.getElementById('token').value;
  const res = await fetch('/monitor/api/login', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({email, access_token: token})
  });
  if (res.ok) {
    window.location.href = '/monitor-ui/index.html';
  } else {
    const data = await res.json().catch(() => ({}));
    document.getElementById('error').textContent = data.detail || 'Falha no login';
  }
}
document.getElementById('token').addEventListener('keydown', e => {
  if (e.key === 'Enter') login();
});
</script>
</body>
</html>
