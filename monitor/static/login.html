<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Atrium Monitor - Login</title>
<link rel="icon" href="img/dark_logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<!-- Link para o CSS gerado pelo comando de build do Tailwind na VPS -->
<link rel="stylesheet" href="css/output.css">
</head>
<body class="bg-bg text-text font-sans min-h-screen flex items-center justify-center overflow-hidden relative">

  <!-- Fundo com gradiente radial sutil -->
  <div class="absolute -top-[20%] left-1/2 w-[80vw] h-[80vh] -translate-x-1/2 bg-[radial-gradient(circle,rgba(143,22,27,0.15)_0%,rgba(15,16,18,0)_70%)] z-0 pointer-events-none"></div>

  <!-- Glassmorphism Container com Animação de Entrada -->
  <div class="w-full max-w-[420px] m-6 bg-panel backdrop-blur-[24px] border border-border border-t-white/15 rounded-[20px] p-12 shadow-[0_25px_50px_-12px_rgba(0,0,0,0.6)] text-center z-10 animate-slideUpFade">
    
    <img src="img/dark_logo.png" alt="Atrium Monitor" class="w-16 mb-5 mx-auto drop-shadow-[0_4px_8px_rgba(0,0,0,0.3)]">
    
    <h1 class="text-2xl font-bold m-0 mb-2 tracking-tight">Atrium Monitor</h1>
    <p class="text-muted text-sm m-0 mb-8">Entre com sua conta do Atrium Chat</p>
    
    <div class="text-left mb-5">
      <label for="email" class="block text-xs font-semibold text-muted uppercase tracking-wider mb-2">E-mail</label>
      <input id="email" type="email" placeholder="seu@email.com" autocomplete="email" 
             class="w-full px-4 py-3.5 text-[0.95rem] rounded-xl border border-border bg-input-bg text-text transition-all duration-200 placeholder-muted/50 hover:border-white/15 focus:outline-none focus:border-accent focus:bg-black/40 focus:ring-4 focus:ring-accent/20">
    </div>
    
    <div class="text-left mb-5">
      <label for="token" class="block text-xs font-semibold text-muted uppercase tracking-wider mb-2">Access Token do Atrium Chat</label>
      <input id="token" type="password" placeholder="••••••••••••" autocomplete="current-password" 
             class="w-full px-4 py-3.5 text-[0.95rem] rounded-xl border border-border bg-input-bg text-text transition-all duration-200 placeholder-muted/50 hover:border-white/15 focus:outline-none focus:border-accent focus:bg-black/40 focus:ring-4 focus:ring-accent/20">
    </div>
    
    <button id="login-btn" onclick="login()" 
            class="w-full bg-gradient-to-br from-accent to-[#701014] text-white border border-white/10 px-4 py-3.5 text-base font-semibold rounded-xl cursor-pointer mt-3 flex items-center justify-center transition-all duration-200 shadow-[0_4px_12px_rgba(143,22,27,0.3)] hover:-translate-y-0.5 hover:from-accent-hover hover:to-accent hover:shadow-[0_6px_16px_rgba(143,22,27,0.5)] active:translate-y-0 active:shadow-[0_2px_8px_rgba(143,22,27,0.4)] disabled:opacity-70 disabled:cursor-not-allowed">
      <span id="btn-text">Entrar no sistema</span>
      <div id="btn-spinner" class="hidden w-5 h-5 border-2 border-white/30 border-t-white rounded-full animate-[spin_0.8s_linear_infinite]"></div>
    </button>
    
    <p id="error" class="text-error text-[0.85rem] font-medium min-h-[18px] mt-4"></p>
  </div>

  <script>
  async function login() {
    const email = document.getElementById('email').value.trim();
    const token = document.getElementById('token').value.trim();
    const errorEl = document.getElementById('error');
    const btn = document.getElementById('login-btn');
    const btnText = document.getElementById('btn-text');
    const btnSpinner = document.getElementById('btn-spinner');

    errorEl.classList.remove('animate-shake');

    if (!email || !token) {
      triggerError('Preencha todos os campos');
      return;
    }

    errorEl.textContent = '';
    btn.disabled = true;
    btnText.classList.add('hidden');
    btnSpinner.classList.remove('hidden');

    try {
      const res = await fetch('/monitor/api/login', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({email, access_token: token})
      });
      
      if (res.ok) {
        window.location.href = '/monitor-ui/index.html';
      } else {
        const data = await res.json().catch(() => ({}));
        triggerError(data.detail || 'Falha na autenticação. Verifique seus dados.');
        resetButton();
      }
    } catch (err) {
      triggerError('Erro de conexão com o servidor.');
      resetButton();
    }

    function triggerError(msg) {
      errorEl.textContent = msg;
      void errorEl.offsetWidth; 
      errorEl.classList.add('animate-shake');
    }

    function resetButton() {
      btn.disabled = false;
      btnText.classList.remove('hidden');
      btnSpinner.classList.add('hidden');
    }
  }

  document.getElementById('token').addEventListener('keydown', e => {
    if (e.key === 'Enter') login();
  });
  </script>
</body>
</html>
